<!DOCTYPE html>
<html>
<head>
    <title>我的 Web3 平台</title>
</head>

<body>
    <h1>我的 Web3 測試平台</h1>
    <p>錢包目前：尚未連接</p>

  <button id="connectWallet">Connect Wallet</button>
<script>
const button = document.getElementById("connectWallet");
const statusText = document.querySelector("p");

async function showAccount() {
    if (!window.ethereum) {
        statusText.textContent = "錢包目前：沒有偵測到錢包";
        return;
    }

    try {
        const accounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        if (accounts && accounts.length > 0) {
            statusText.textContent = "錢包目前：" + accounts[0];
        }
    } catch (error) {
        console.log(error);
    }
}

button.addEventListener("click", async () => {
    if (!window.ethereum) {
        alert("目前沒有偵測到錢包");
        return;
    }

    try {
        await window.ethereum.request({
            method: "eth_requestAccounts"
        });

        await showAccount();

    } catch (error) {
        console.log(error);
        alert("錢包連接沒有完成");
    }
});

if (window.ethereum) {
    window.ethereum.on("accountsChanged", function(accounts) {
        if (accounts.length > 0) {
            statusText.textContent = "錢包目前：" + accounts[0];
        } else {
            statusText.textContent = "錢包目前：尚未連接";
        }
    });
}

showAccount();
</script>
</body>
</html>
