<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Web3 平台</title>
</head>

<body>
<style>
  body {
    color: white;
    background: black;
  }
</style>
  <h1>我的 Web3 測試平台</h1>

  <p id="status">錢包目前：尚未連接</p>

  <button id="connectWallet">Connect Wallet</button>
  <br><br>
<button id="signMessage">測試簽名</button>
<p id="signStatus"></p>

 <script type="module">
  
  const projectId = "82e825b08a8b2c568e019cb081046504"; const button = document.getElementById("connectWallet");
    const statusText = document.getElementById("status");
    const signButton = document.getElementById("signMessage");
    const signStatus = document.getElementById("signStatus");

    function getWallet() {
      if (typeof window.ethereum !== "undefined") {
        return window.ethereum;
      }

      return null;
    }

    async function showAccount() {
      const ethereum = getWallet();

      if (!ethereum) {
        statusText.textContent = "目前沒有偵測到錢包";
        return;
      }

      try {
        const accounts = await ethereum.request({
          method: "eth_accounts"
        });

        if (accounts && accounts.length > 0) {
          statusText.textContent =
            "已連接：" +
            accounts[0].slice(0, 6) +
            "..." +
            accounts[0].slice(-4);
        } else {
          statusText.textContent = "已偵測到錢包，但尚未連接";
        }
      } catch (error) {
        console.error(error);
        statusText.textContent = "讀取錢包失敗";
      }
    }

    button.addEventListener("click", async () => {
      const ethereum = getWallet();

      if (!ethereum) {
        alert("目前沒有偵測到瀏覽器錢包。請確認錢包擴充功能已安裝並啟用。");
        return;
      }

      try {
        const accounts = await ethereum.request({
          method: "eth_requestAccounts"
        });

        if (accounts && accounts.length > 0) {
          statusText.textContent =
            "已連接：" +
            accounts[0].slice(0, 6) +
            "..." +
            accounts[0].slice(-4);
        }
      } catch (error) {
        console.error(error);
        alert("錢包連接沒有完成");
      }
    });
    signButton.addEventListener("click", async () => {
    const ethereum = getWallet();

    if (!ethereum) {
        alert("目前沒有偵測到錢包");
        return;
    }

    try {
        const accounts = await ethereum.request({
            method: "eth_requestAccounts"
        });

        const message = "這是我的 Web3 測試簽名";

        const signature = await ethereum.request({
            method: "personal_sign",
            params: [message, accounts[0]]
        });

      signStatus.textContent = "簽名成功：" + signature.slice(0, 10) + "...";
        console.log("signature:", signature);
    } catch (error) {
    console.error(error);
    signStatus.textContent =
    "簽名錯誤：" + (error?.message || String(error));
});

    if (window.ethereum) {
      window.ethereum.on("accountsChanged", showAccount);
    }
window.addEventListener("focus", () => {
    setTimeout(showAccount, 1000);
});

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        setTimeout(showAccount, 1000);
    }
});
    showAccount();
  </script>

</body>
</html>
